services:
  wilson-server:
    container_name: 'wilson-server'
    image: 'jchristn77/wilson-server:v0.1.0'
    ports:
      - "9400:9400"
    volumes:
      - wilson-data:/app/data
      - wilson-workspace:/workspace
      - ./wilson.json:/app/wilson.json
    depends_on:
      - otel-collector

  wilson-dashboard:
    container_name: 'wilson-dashboard'
    image: 'jchristn77/wilson-dashboard:v0.1.0'
    environment:
      WILSON_SERVER_URL: http://127.0.0.1:9400
    ports:
      - "9401:80"
    depends_on:
      - wilson-server

  postgres:
    image: postgres:18-alpine
    profiles: [ "postgres" ]
    environment:
      POSTGRES_DB: wilson
      POSTGRES_USER: wilson
      POSTGRES_PASSWORD: wilson
    ports:
      - "5432:5432"
    volumes:
      - wilson-postgres:/var/lib/postgresql/data

  # ---- Observability stack (metrics, traces, logs) ----

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.55.1
    command: [ "--config.file=/etc/prometheus/prometheus.yml" ]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - wilson-prometheus:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - wilson-tempo:/var/tempo
    ports:
      - "3200:3200"   # Tempo query
      - "4319:4317"   # OTLP gRPC (host-mapped to avoid clashing with the collector on 4317)

  loki:
    image: grafana/loki:3.2.1
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - wilson-loki:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  wilson-data:
  wilson-workspace:
  wilson-postgres:
  wilson-prometheus:
  wilson-tempo:
  wilson-loki:
